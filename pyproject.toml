[project]
name = "RES4SHO"
version = "1.4.2"
description = "High-Frequency Detail Sampling based on Res Sampling for ComfyUI"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT License" }
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent"
]
# Pure-torch sampling code -- everything it imports (torch, tqdm, aiohttp)
# already ships with ComfyUI. Declaring nothing here keeps the installer from
# touching the user's existing torch build.
dependencies = []

[project.urls]
Repository = "https://github.com/WASasquatch/RES4SHO"
"Bug Tracker" = "https://github.com/WASasquatch/RES4SHO/issues"

[tool.comfy]
PublisherId = "was"
DisplayName = "RES4SHO"
requires-comfyui = ">=0.3.11"
